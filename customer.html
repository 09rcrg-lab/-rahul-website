<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Order Status - Rahul Social Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050505;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin: 25px 0;
    }

    .logo span {
      color: #39ff14;
    }

    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 0 25px rgba(57,255,20,0.08);
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    .order-id {
      text-align: center;
      color: #39ff14;
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0 25px;
      word-break: break-all;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid #222;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .label {
      color: #aaa;
    }

    .value {
      text-align: right;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: #222;
    }

    .pending {
      color: #ffd400;
    }

    .processing {
      color: #00c8ff;
    }

    .completed {
      color: #39ff14;
    }

    .cancelled {
      color: #ff4444;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #aaa;
    }

    .error {
      text-align: center;
      color: #ff4444;
      line-height: 1.6;
    }

    .retry {
      margin-top: 20px;
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #39ff14;
      color: #000;
      font-weight: bold;
      font-size: 16px;
    }

    .footer {
      text-align: center;
      color: #777;
      margin-top: 25px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Rahul <span>Social Hub</span>
    </div>

    <div class="card">

      <h2>📦 Order Status</h2>

      <div id="content">
        <div class="loading">
          Order information load हो रही है...
        </div>
      </div>

    </div>

    <div class="footer">
      © 2026 Rahul Social Hub
    </div>

  </div>


<script>

const API_BASE =
  "https://rahulsocialhub-db.09rcrg.workers.dev";


// ==========================================
// GET ORDER ID FROM URL
// ==========================================

function getOrderId() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("order");
}


// ==========================================
// LOAD ORDER FROM D1
// ==========================================

async function loadOrder() {

  const content =
    document.getElementById("content");

  const orderId =
    getOrderId();


  if (!orderId) {

    content.innerHTML = `
      <div class="error">
        ❌ Order ID नहीं मिला।
        <br><br>
        कृपया QR code से दोबारा खोलें।
      </div>
    `;

    return;
  }


  try {

    const response =
      await fetch(
        `${API_BASE}/api/orders/${encodeURIComponent(orderId)}`
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success ||
      !data.order
    ) {

      throw new Error(
        data.error || "Order not found"
      );
    }


    showOrder(data.order);


  } catch (error) {

    // Offline fallback
    const localOrders =
      JSON.parse(
        localStorage.getItem(
          "rahul_orders"
        ) || "[]"
      );


    const localOrder =
      localOrders.find(
        order =>
          order.id === orderId
      );


    if (localOrder) {

      showOrder(localOrder);

      return;
    }


    content.innerHTML = `
      <div class="error">

        ❌ Order नहीं मिला।

        <br><br>

        Order ID:
        <strong>${escapeHTML(orderId)}</strong>

        <br><br>

        Internet connection check करें।

        <button
          class="retry"
          onclick="loadOrder()"
        >
          🔄 फिर से कोशिश करें
        </button>

      </div>
    `;
  }
}


// ==========================================
// SHOW ORDER
// ==========================================

function showOrder(order) {

  const content =
    document.getElementById("content");


  const status =
    String(
      order.status || "Pending"
    );


  const statusClass =
    status.toLowerCase()
      .replace(/\s+/g, "");


  const date =
    order.createdAt ||
    order.created_at ||
    "";


  let formattedDate = date;


  if (date) {

    try {

      formattedDate =
        new Date(date)
          .toLocaleString("hi-IN");

    } catch (e) {}
  }


  content.innerHTML = `

    <div class="order-id">
      ${escapeHTML(order.id)}
    </div>

    <div class="row">
      <div class="label">
        Service
      </div>

      <div class="value">
        ${escapeHTML(
          order.serviceName ||
          order.service_name ||
          "-"
        )}
      </div>
    </div>


    <div class="row">
      <div class="label">
        Quantity
      </div>

      <div class="value">
        ${Number(
          order.quantity || 0
        )}
      </div>
    </div>


    <div class="row">
      <div class="label">
        Units
      </div>

      <div class="value">
        ${Number(
          order.units || 0
        ).toLocaleString("en-IN")}
      </div>
    </div>


    <div class="row">
      <div class="label">
        Amount
      </div>

      <div class="value">
        ₹${Number(
          order.amount || 0
        ).toLocaleString("en-IN")}
      </div>
    </div>


    <div class="row">
      <div class="label">
        Lifetime Refill
      </div>

      <div class="value">
        ${
          order.lifetimeRefill
            ? "✅ Yes"
            : "❌ No"
        }
      </div>
    </div>


    <div class="row">
      <div class="label">
        Referral
      </div>

      <div class="value">
        ${
          order.referral
            ? "✅ Yes"
            : "❌ No"
        }
      </div>
    </div>


    <div class="row">
      <div class="label">
        Status
      </div>

      <div class="value">

        <span class="status ${statusClass}">
          ${escapeHTML(status)}
        </span>

      </div>
    </div>


    <div class="row">

      <div class="label">
        Order Date
      </div>

      <div class="value">
        ${escapeHTML(
          formattedDate || "-"
        )}
      </div>

    </div>

  `;
}


// ==========================================
// SECURITY
// ==========================================

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


// ==========================================
// START
// ==========================================

loadOrder();

</script>

</body>
</html>
