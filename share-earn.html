<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Share & Earn - Rahul Social Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #111;
      border: 1px solid #20d46b;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 0 25px rgba(32, 212, 107, 0.15);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 5px 0 10px;
      font-size: 27px;
    }

    .green {
      color: #20d46b;
      font-weight: bold;
    }

    .text {
      color: #ccc;
      line-height: 1.6;
      font-size: 15px;
    }

    .reward {
      margin: 20px 0;
      padding: 18px;
      border-radius: 14px;
      background: #181818;
      border: 1px solid #20d46b;
    }

    .reward-number {
      font-size: 30px;
      color: #20d46b;
      font-weight: bold;
    }

    .reward-small {
      color: #aaa;
      margin-top: 5px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      background: #20d46b;
      color: #000;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:active {
      transform: scale(0.98);
    }

    .link-box {
      margin-top: 18px;
      padding: 12px;
      background: #080808;
      border-radius: 10px;
      color: #aaa;
      font-size: 12px;
      word-break: break-all;
      display: none;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">🎁</div>

    <h1>Share & Earn</h1>

    <div class="text">
      अपनी Rahul Social Hub website link अपने दोस्तों के साथ share करें।
      <br><br>
      आपके referral link से कोई <span class="green">successful order</span>
      करता है, तो आपको free views मिलेंगे।
    </div>

    <div class="reward">
      <div class="reward-number">5,000 FREE VIEWS</div>

      <div class="reward-small">
        5 Videos × 1,000 Views
      </div>
    </div>

    <button id="shareButton">
      📤 Share Website
    </button>

    <button id="copyButton">
      🔗 Copy Referral Link
    </button>

    <div id="linkBox" class="link-box"></div>

    <div class="note">
      Reward successful order के बाद referral verification के अनुसार दिया जाएगा।
    </div>

  </div>

  <script>

    const REF_KEY = "rahul_referral_code";

    function createCode() {

      const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

      let code = "RSH-";

      for (let i = 0; i < 6; i++) {
        code += chars[
          Math.floor(Math.random() * chars.length)
        ];
      }

      return code;
    }

    let referralCode =
      localStorage.getItem(REF_KEY);

    if (!referralCode) {

      referralCode = createCode();

      localStorage.setItem(
        REF_KEY,
        referralCode
      );
    }

    function getReferralLink() {

      return window.location.origin +
        window.location.pathname.replace(
          "share-earn.html",
          "index.html"
        ) +
        "?ref=" +
        encodeURIComponent(referralCode);
    }

    const shareButton =
      document.getElementById("shareButton");

    const copyButton =
      document.getElementById("copyButton");

    const linkBox =
      document.getElementById("linkBox");

    shareButton.addEventListener(
      "click",
      async function () {

        const link = getReferralLink();

        const text =
          "Rahul Social Hub Instagram Services 🚀\n\n" +
          "Instagram services के लिए website देखें:\n" +
          link;

        if (navigator.share) {

          try {

            await navigator.share({
              title: "Rahul Social Hub",
              text: text,
              url: link
            });

          } catch (error) {}

        } else {

          copyLink();

        }

      }
    );

    async function copyLink() {

      const link = getReferralLink();

      try {

        await navigator.clipboard.writeText(link);

        linkBox.style.display = "block";

        linkBox.textContent =
          "Referral Link Copied ✅\n\n" + link;

        alert(
          "Referral link copy हो गया ✅"
        );

      } catch (error) {

        linkBox.style.display = "block";

        linkBox.textContent = link;

      }

    }

    copyButton.addEventListener(
      "click",
      copyLink
    );

  </script>

</body>
</html>
