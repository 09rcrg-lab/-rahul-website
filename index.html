<!DOCTYPE html>
<html lang="hi">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <meta
        name="description"
        content="Rahul Live - Short Videos and Live Streaming"
    >

    <title>Rahul Live</title>

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- =====================================================
     AUTH SCREEN
===================================================== -->

<section id="authScreen">

    <div class="authBox">

        <div class="logo">
            Rahul Live
        </div>

        <div class="tagline">
            Short Videos • LIVE Streaming
        </div>


        <div class="authTabs">

            <button
                id="loginTab"
                class="active"
                type="button"
            >
                Login
            </button>

            <button
                id="registerTab"
                type="button"
            >
                Register
            </button>

        </div>


        <!-- LOGIN -->

        <form id="loginForm">

            <div class="inputGroup">

                <input
                    id="loginUsername"
                    type="text"
                    placeholder="Username या Email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="inputGroup">

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                class="mainBtn"
                type="submit"
            >
                Login
            </button>

        </form>


        <!-- REGISTER -->

        <form
            id="registerForm"
            style="display:none;"
        >

            <div class="inputGroup">

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="inputGroup">

                <input
                    id="registerEmail"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="inputGroup">

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Password (कम से कम 6 characters)"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                class="mainBtn"
                type="submit"
            >
                Create Account
            </button>

        </form>


        <div
            id="authMessage"
            class="authMessage"
        ></div>

    </div>

</section>



<!-- =====================================================
     MAIN APP
===================================================== -->

<section id="appScreen">


    <!-- TOP BAR -->

    <header class="topBar">

        <div class="topLogo">
            Rahul Live
        </div>


        <button
            id="topLiveBtn"
            class="liveTopBtn"
            type="button"
        >
            🔴 LIVE
        </button>

    </header>



    <!-- MAIN CONTENT -->

    <main class="content">


        <!-- =================================================
             HOME
        ================================================= -->

        <section
            id="homePage"
            class="page active"
        >

            <div
                id="videoFeed"
                class="videoFeed"
            >

                <div class="loadingBox">
                    Videos loading...
                </div>

            </div>

        </section>



        <!-- =================================================
             LIVE
        ================================================= -->

        <section
            id="livePage"
            class="page"
        >

            <div class="pageHeader">

                <h2>
                    🔴 LIVE
                </h2>

            </div>


            <div class="startLiveBox">

                <div class="liveIcon">
                    🔴
                </div>

                <h3>
                    Go LIVE
                </h3>

                <p>
                    अपने followers के साथ LIVE आएं।
                </p>


                <button
                    id="startLiveBtn"
                    class="startLiveBtn"
                    type="button"
                >
                    Start LIVE
                </button>

            </div>


            <div
                id="liveGrid"
                class="liveGrid"
            ></div>

        </section>



        <!-- =================================================
             UPLOAD
        ================================================= -->

        <section
            id="uploadPage"
            class="page"
        >

            <div class="uploadBox">

                <div class="pageHeader">

                    <h2>
                        🎬 Upload Short
                    </h2>

                </div>


                <p class="uploadText">
                    अपना Short Video select करें।
                </p>


                <label
                    for="videoFile"
                    class="uploadBtn"
                >
                    📁 Select Video
                </label>


                <input
                    id="videoFile"
                    type="file"
                    accept="video/*"
                    hidden
                >


                <div
                    id="selectedVideo"
                    class="selectedVideo"
                >
                    No video selected
                </div>


                <video
                    id="uploadPreview"
                    controls
                    playsinline
                    style="display:none;"
                ></video>


                <button
                    id="uploadVideoBtn"
                    class="mainBtn"
                    type="button"
                >
                    Upload Video
                </button>


                <div
                    id="uploadMessage"
                    class="authMessage"
                ></div>

            </div>

        </section>



        <!-- =================================================
             PROFILE
        ================================================= -->

        <section
            id="profilePage"
            class="page"
        >

            <div class="profileBox">


                <div
                    id="profileAvatar"
                    class="avatar"
                >
                    R
                </div>


                <div
                    id="profileName"
                    class="profileName"
                >
                    User
                </div>


                <div
                    id="profileUsername"
                    class="profileUsername"
                >
                    @user
                </div>


                <div
                    id="profileBio"
                    class="profileBio"
                ></div>


                <div class="profileStats">


                    <div class="stat">

                        <strong id="profileVideos">
                            0
                        </strong>

                        <span>
                            Videos
                        </span>

                    </div>


                    <div class="stat">

                        <strong id="profileFollowers">
                            0
                        </strong>

                        <span>
                            Followers
                        </span>

                    </div>


                    <div class="stat">

                        <strong id="profileFollowing">
                            0
                        </strong>

                        <span>
                            Following
                        </span>

                    </div>

                </div>


                <button
                    id="logoutBtn"
                    class="logoutBtn"
                    type="button"
                >
                    Logout
                </button>

            </div>

        </section>


    </main>



    <!-- =================================================
         BOTTOM NAV
    ================================================= -->

    <nav class="bottomNav">


        <button
            class="navBtn active"
            data-page="homePage"
            type="button"
        >

            <span>🏠</span>

            Home

        </button>


        <button
            class="navBtn"
            data-page="livePage"
            type="button"
        >

            <span>🔴</span>

            LIVE

        </button>


        <button
            class="navBtn"
            data-page="uploadPage"
            type="button"
        >

            <span>➕</span>

            Upload

        </button>


        <button
            class="navBtn"
            data-page="profilePage"
            type="button"
        >

            <span>👤</span>

            Profile

        </button>


    </nav>


</section>



<!-- =====================================================
     LIVE STUDIO
===================================================== -->

<section
    id="liveStudio"
    style="display:none;"
>


    <video
        id="livePreview"
        autoplay
        muted
        playsinline
    ></video>


    <div class="liveStudioTop">

        <input
            id="liveTitle"
            type="text"
            placeholder="LIVE title"
            value="Rahul Live"
            maxlength="150"
        >

    </div>


    <div class="liveStudioControls">


        <button
            id="goLiveConfirmBtn"
            type="button"
            class="goLiveBtn"
        >
            🔴 Go LIVE
        </button>


        <button
            id="endLiveBtn"
            type="button"
            class="endLiveBtn"
            style="display:none;"
        >
            End LIVE
        </button>


        <button
            id="closeLiveStudio"
            type="button"
            class="closeLiveBtn"
        >
            ✕
        </button>

    </div>


</section>



<!-- JAVASCRIPT -->

<script src="script.js"></script>

</body>
</html>
