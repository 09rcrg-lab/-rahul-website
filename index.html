<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Rahul Live - Chat Only LIVE">
  <title>Rahul Live</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ================= APP ================= -->
  <div id="app">
    <!-- ================= AUTH SCREEN ================= -->
    <section id="authScreen" class="screen">
      <div class="auth-box">
        <div class="app-logo">RL</div>
        <h1>Rahul Live</h1>
        <p class="subtitle">Chat • LIVE • Connect</p>
        <!-- LOGIN -->
        <div id="loginForm" class="auth-form">
          <h2>Login</h2>
          <input
            type="text"
            id="loginUsername"
            placeholder="Username"
            autocomplete="username"
          >
          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            autocomplete="current-password"
          >
          <button id="loginBtn" type="button">
            Login
          </button>
          <p>
            Account नहीं है?
            <button id="showRegisterBtn" class="link-btn" type="button">
              Register
            </button>
          </p>
        </div>
        <!-- REGISTER -->
        <div id="registerForm" class="auth-form hidden">
          <h2>Register</h2>
          <input
            type="text"
            id="registerUsername"
            placeholder="Username"
            autocomplete="username"
          >
          <input
            type="email"
            id="registerEmail"
            placeholder="Email"
            autocomplete="email"
          >
          <input
            type="password"
            id="registerPassword"
            placeholder="Password"
            autocomplete="new-password"
          >
          <button id="registerBtn" type="button">
            Register
          </button>
          <p>
            पहले से account है?
            <button id="showLoginBtn" class="link-btn" type="button">
              Login
            </button>
          </p>
        </div>
        <div id="authMessage" class="message"></div>
      </div>
    </section>
    <!-- ================= LIVE APP ================= -->
    <section id="liveApp" class="screen hidden">
      <!-- TOP BAR -->
      <header class="top-bar">
        <div class="brand">
          <strong>Rahul Live</strong>
        </div>
        <div class="top-actions">
          <span id="onlineStatus" class="online-status">
            ● Online
          </span>
          <button id="logoutBtn" class="icon-btn" type="button">
            Logout
          </button>
        </div>
      </header>
      <!-- ================= LIVE ROOM ================= -->
      <main class="live-room">
        <!-- LIVE HEADER -->
        <div class="live-header">
          <div class="live-info">
            <span class="live-badge">
              🔴 LIVE
            </span>
            <span id="liveTitle">
              Chat LIVE Room
            </span>
          </div>
          <div class="viewer-count">
            👥 <span id="viewerCount">0</span>
          </div>
        </div>
        <!-- ================= HOST ================= -->
        <section class="host-card">
          <div class="host-avatar" id="hostAvatar">
            H
          </div>
          <div class="host-info">
            <strong id="hostName">
              Host
            </strong>
            <span>
              🎙️ LIVE Host
            </span>
          </div>
          <span class="host-label">
            HOST
          </span>
        </section>
        <!-- ================= ROOM AREA ================= -->
        <section class="room-content">
          <div class="room-message">
            <div class="room-icon">
              💬
            </div>
            <h2>Chat-only LIVE</h2>
            <p>
              यहाँ लोग बैठकर LIVE chat कर सकते हैं।
            </p>
          </div>
        </section>
        <!-- ================= CHAT ================= -->
        <section class="chat-section">
          <div class="chat-header">
            <strong>Live Chat</strong>
            <span id="chatUserCount">
              0 viewers
            </span>
          </div>
          <!-- CHAT MESSAGES -->
          <div id="chatMessages" class="chat-messages">
            <div class="system-message">
              LIVE room में आपका स्वागत है 👋
            </div>
          </div>
          <!-- EMOJI PANEL -->
          <div id="emojiPanel" class="emoji-panel hidden">
            <button type="button" data-emoji="😀">😀</button>
            <button type="button" data-emoji="😂">😂</button>
            <button type="button" data-emoji="🤣">🤣</button>
            <button type="button" data-emoji="😆">😆</button>
            <button type="button" data-emoji="❤️">❤️</button>
            <button type="button" data-emoji="🔥">🔥</button>
            <button type="button" data-emoji="👍">👍</button>
            <button type="button" data-emoji="👏">👏</button>
            <button type="button" data-emoji="🎉">🎉</button>
            <button type="button" data-emoji="😎">😎</button>
            <button type="button" data-emoji="🤡">🤡</button>
            <button type="button" data-emoji="😡">😡</button>
            <button type="button" data-emoji="😭">😭</button>
            <button type="button" data-emoji="😱">😱</button>
            <button type="button" data-emoji="💀">💀</button>
            <button type="button" data-emoji="🔨">🔨</button>
          </div>
          <!-- QUICK REACTIONS -->
          <div class="quick-reactions">
            <button type="button" data-reaction="😂">
              😂
            </button>
            <button type="button" data-reaction="❤️">
              ❤️
            </button>
            <button type="button" data-reaction="🔥">
              🔥
            </button>
            <button type="button" data-reaction="👏">
              👏
            </button>
            <button type="button" data-reaction="🔨">
              🔨
            </button>
          </div>
          <!-- CHAT INPUT -->
          <div class="chat-input-area">
            <button
              id="emojiBtn"
              class="emoji-btn"
              type="button"
              aria-label="Emoji"
            >
              😀
            </button>
            <input
              type="text"
              id="chatInput"
              placeholder="Message लिखें..."
              maxlength="500"
              autocomplete="off"
            >
            <button
              id="sendChatBtn"
              class="send-btn"
              type="button"
            >
              Send
            </button>
          </div>
        </section>
        <!-- ================= VIEWERS ================= -->
        <section class="viewers-section">
          <div class="section-title">
            <strong>Viewers</strong>
            <span id="viewerTotal">0</span>
          </div>
          <div id="viewerList" class="viewer-list">
            <!-- Viewers यहाँ JavaScript से आएँगे -->
          </div>
        </section>
        <!-- ================= HOST CONTROLS ================= -->
        <section id="hostControls" class="host-controls hidden">
          <h3>Host Controls</h3>
          <div class="control-buttons">
            <button id="muteBtn" type="button">
              🔇 Mute
            </button>
            <button id="kickBtn" type="button">
              👢 Kick
            </button>
            <button id="blockBtn" type="button">
              🚫 Block
            </button>
            <button id="endLiveBtn" class="danger-btn" type="button">
              🛑 End LIVE
            </button>
          </div>
        </section>
        <!-- ================= USER ACTIONS ================= -->
        <section class="user-actions">
          <button id="joinLiveBtn" type="button">
            🔴 Join LIVE
          </button>
          <button id="leaveLiveBtn" type="button">
            🚪 Leave LIVE
          </button>
        </section>
      </main>
    </section>
  </div>
  <!-- ================= TOAST ================= -->
  <div id="toast" class="toast hidden"></div>
  <!-- ================= SCRIPT ================= -->
  <script src="script.js"></script>
</body>
</html>
