<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Rahul Live</title>

    <meta name="theme-color" content="#000000">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        /* ================= AUTH ================= */

        #authScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at top, #073b19 0%, #000 45%);
        }

        .authBox {
            width: 100%;
            max-width: 400px;
            padding: 28px 22px;
            border: 1px solid #19ff68;
            border-radius: 20px;
            background: rgba(5, 5, 5, 0.96);
            box-shadow: 0 0 25px rgba(0, 255, 90, .18);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: #19ff68;
            margin-bottom: 8px;
        }

        .tagline {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .authTabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .authTabs button {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #111;
            color: #aaa;
        }

        .authTabs button.active {
            background: #19ff68;
            color: #000;
            border-color: #19ff68;
            font-weight: bold;
        }

        .inputGroup {
            margin-bottom: 14px;
        }

        .inputGroup input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            outline: none;
        }

        .inputGroup input:focus {
            border-color: #19ff68;
        }

        .mainBtn {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #19ff68;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .authMessage {
            text-align: center;
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }

        /* ================= APP ================= */

        #appScreen {
            display: none;
            min-height: 100vh;
            background: #000;
        }

        .topBar {
            height: 58px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            background: rgba(0,0,0,.88);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222;
        }

        .topLogo {
            color: #19ff68;
            font-size: 21px;
            font-weight: bold;
        }

        .liveTopBtn {
            border: 1px solid #ff304f;
            background: #180006;
            color: #ff304f;
            border-radius: 20px;
            padding: 7px 12px;
            font-weight: bold;
        }

        .content {
            padding-top: 58px;
            padding-bottom: 70px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* ================= FEED ================= */

        .videoFeed {
            height: calc(100vh - 128px);
            overflow-y: auto;
            scroll-snap-type: y mandatory;
        }

        .videoCard {
            position: relative;
            height: calc(100vh - 128px);
            scroll-snap-align: start;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .videoCard video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
        }

        .videoOverlay {
            position: absolute;
            left: 15px;
            right: 15px;
            bottom: 20px;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .videoInfo {
            max-width: 70%;
        }

        .username {
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 8px;
        }

        .caption {
            color: #ddd;
            line-height: 1.4;
        }

        .videoActions {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
        }

        .actionBtn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid #555;
            background: rgba(0,0,0,.55);
            color: #fff;
            font-size: 20px;
        }

        .actionCount {
            font-size: 11px;
            margin-top: -9px;
        }

        /* ================= LIVE ================= */

        .sectionTitle {
            padding: 20px 15px 10px;
            font-size: 24px;
            font-weight: bold;
        }

        .liveGrid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .liveCard {
            min-height: 180px;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(145deg, #190006, #111);
            border: 1px solid #333;
        }

        .liveThumb {
            height: 135px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            background: #151515;
        }

        .liveBadge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #ff1744;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }

        .liveName {
            padding: 9px;
            font-weight: bold;
        }

        .startLiveBox {
            margin: 15px;
            padding: 20px;
            border: 1px solid #ff1744;
            border-radius: 15px;
            text-align: center;
            background: #100005;
        }

        .startLiveBtn {
            margin-top: 12px;
            padding: 13px 25px;
            border: 0;
            border-radius: 25px;
            background: #ff1744;
            color: #fff;
            font-weight: bold;
        }

        /* ================= UPLOAD ================= */

        .uploadBox {
            margin: 20px 15px;
            padding: 25px 15px;
            border: 1px dashed #19ff68;
            border-radius: 15px;
            text-align: center;
        }

        .uploadBox input {
            display: none;
        }

        .uploadBtn {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 20px;
            border-radius: 25px;
            background: #19ff68;
            color: #000;
            font-weight: bold;
        }

        /* ================= PROFILE ================= */

        .profileBox {
            padding: 25px 15px;
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: auto;
            background: #19ff68;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
        }

        .profileName {
            margin-top: 12px;
            font-size: 21px;
            font-weight: bold;
        }

        .profileStats {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-top: 20px;
        }

        .stat strong {
            display: block;
            font-size: 18px;
        }

        .stat span {
            color: #999;
            font-size: 12px;
        }

        .logoutBtn {
            margin-top: 25px;
            padding: 12px 25px;
            border: 1px solid #ff304f;
            background: transparent;
            color: #ff304f;
            border-radius: 20px;
        }

        /* ================= BOTTOM NAV ================= */

        .bottomNav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            z-index: 100;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(0,0,0,.94);
            border-top: 1px solid #222;
        }

        .navBtn {
            border: 0;
            background: transparent;
            color: #777;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .navBtn span {
            font-size: 22px;
        }

        .navBtn.active {
            color: #19ff68;
        }

        @media (min-width: 700px) {
            .videoFeed {
                max-width: 500px;
                margin: auto;
            }

            .bottomNav,
            .topBar {
                max-width: 700px;
                margin: auto;
            }
        }
    </style>
</head>

<body>

<!-- ========================================================= -->
<!-- LOGIN / REGISTER -->
<!-- ========================================================= -->

<section id="authScreen">

    <div class="authBox">

        <div class="logo">RAHUL LIVE</div>

        <div class="tagline">
            Short Videos • LIVE • Social
        </div>

        <div class="authTabs">
            <button id="loginTab" class="active" onclick="showLogin()">
                Login
            </button>

            <button id="registerTab" onclick="showRegister()">
                Register
            </button>
        </div>

        <!-- LOGIN -->

        <div id="loginForm">

            <div class="inputGroup">
                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Username or Email"
                    autocomplete="username">
            </div>

            <div class="inputGroup">
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    autocomplete="current-password">
            </div>

            <button class="mainBtn" onclick="loginUser()">
                Login
            </button>

        </div>

        <!-- REGISTER -->

        <div id="registerForm" style="display:none;">

            <div class="inputGroup">
                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Username"
                    autocomplete="username">
            </div>

            <div class="inputGroup">
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                    autocomplete="email">
            </div>

            <div class="inputGroup">
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                    autocomplete="new-password">
            </div>

            <button class="mainBtn" onclick="registerUser()">
                Create Account
            </button>

        </div>

        <div id="authMessage" class="authMessage"></div>

    </div>

</section>


<!-- ========================================================= -->
<!-- MAIN APP -->
<!-- ========================================================= -->

<section id="appScreen">

    <!-- TOP BAR -->

    <header class="topBar">

        <div class="topLogo">
            Rahul Live
        </div>

        <button class="liveTopBtn" onclick="openPage('livePage')">
            🔴 LIVE
        </button>

    </header>


    <main class="content">

        <!-- ================= HOME ================= -->

        <section id="homePage" class="page active">

            <div class="videoFeed">

                <div class="videoCard">

                    <video
                        controls
                        playsinline
                        loop
                        preload="metadata">
                    </video>

                    <div class="videoOverlay">

                        <div class="videoInfo">

                            <div class="username">
                                @rahul
                            </div>

                            <div class="caption">
                                Welcome to Rahul Live 🎬
                            </div>

                        </div>

                        <div class="videoActions">

                            <button class="actionBtn">
                                ❤️
                            </button>

                            <div class="actionCount">
                                0
                            </div>

                            <button class="actionBtn">
                                💬
                            </button>

                            <div class="actionCount">
                                0
                            </div>

                            <button class="actionBtn">
                                ↗️
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- ================= LIVE ================= -->

        <section id="livePage" class="page">

            <div class="sectionTitle">
                🔴 Live Now
            </div>

            <div class="startLiveBox">

                <h3>Go Live</h3>

                <p style="color:#aaa;margin-top:8px;">
                    Start your own live stream
                </p>

                <button class="startLiveBtn"
                        onclick="startLive()">
                    🔴 Start Live
                </button>

            </div>

            <div class="liveGrid">

                <div class="liveCard">

                    <div class="liveThumb">
                        👤
                    </div>

                    <div class="liveBadge">
                        LIVE
                    </div>

                    <div class="liveName">
                        No live streams
                    </div>

                </div>

            </div>

        </section>


        <!-- ================= UPLOAD ================= -->

        <section id="uploadPage" class="page">

            <div class="sectionTitle">
                ⬆️ Upload Video
            </div>

            <div class="uploadBox">

                <h3>
                    Create a Short Video
                </h3>

                <p style="color:#aaa;margin-top:8px;">
                    Select a video from your device
                </p>

                <input
                    type="file"
                    id="videoInput"
                    accept="video/*">

                <label
                    for="videoInput"
                    class="uploadBtn">
                    📹 Select Video
                </label>

                <div id="selectedVideo"
                     style="margin-top:15px;color:#19ff68;">
                </div>

            </div>

        </section>


        <!-- ================= PROFILE ================= -->

        <section id="profilePage" class="page">

            <div class="profileBox">

                <div class="avatar">
                    R
                </div>

                <div class="profileName"
                     id="profileUsername">
                    Rahul
                </div>

                <div class="profileStats">

                    <div class="stat">
                        <strong>0</strong>
                        <span>Videos</span>
                    </div>

                    <div class="stat">
                        <strong>0</strong>
                        <span>Followers</span>
                    </div>

                    <div class="stat">
                        <strong>0</strong>
                        <span>Following</span>
                    </div>

                </div>

                <button class="logoutBtn"
                        onclick="logoutUser()">
                    Logout
                </button>

            </div>

        </section>

    </main>


    <!-- ================= BOTTOM NAV ================= -->

    <nav class="bottomNav">

        <button class="navBtn active"
                onclick="openPage('homePage', this)">
            <span>🏠</span>
            Home
        </button>

        <button class="navBtn"
                onclick="openPage('livePage', this)">
            <span>🔴</span>
            LIVE
        </button>

        <button class="navBtn"
                onclick="openPage('uploadPage', this)">
            <span>➕</span>
            Upload
        </button>

        <button class="navBtn"
                onclick="openPage('profilePage', this)">
            <span>👤</span>
            Profile
        </button>

    </nav>

</section>


<script>

    /* =========================================================
       AUTH UI
    ========================================================= */

    function showLogin() {

        document.getElementById("loginForm").style.display = "block";
        document.getElementById("registerForm").style.display = "none";

        document.getElementById("loginTab").classList.add("active");
        document.getElementById("registerTab").classList.remove("active");

        document.getElementById("authMessage").innerText = "";
    }


    function showRegister() {

        document.getElementById("loginForm").style.display = "none";
        document.getElementById("registerForm").style.display = "block";

        document.getElementById("loginTab").classList.remove("active");
        document.getElementById("registerTab").classList.add("active");

        document.getElementById("authMessage").innerText = "";
    }


    /* =========================================================
       TEMPORARY LOCAL AUTH
       REAL DATABASE/API WILL BE CONNECTED IN NEXT FILES
    ========================================================= */

    function registerUser() {

        const username =
            document.getElementById("registerUsername").value.trim();

        const email =
            document.getElementById("registerEmail").value.trim();

        const password =
            document.getElementById("registerPassword").value;

        const message =
            document.getElementById("authMessage");


        if (!username || !email || !password) {

            message.innerText =
                "Please fill all fields.";

            return;
        }


        if (password.length < 6) {

            message.innerText =
                "Password must be at least 6 characters.";

            return;
        }


        localStorage.setItem(
            "rahul_user",
            JSON.stringify({
                username: username,
                email: email,
                password: password
            })
        );


        message.innerText =
            "Account created successfully.";

        document.getElementById("loginUsername").value =
            username;

        showLogin();
    }


    function loginUser() {

        const username =
            document.getElementById("loginUsername").value.trim();

        const password =
            document.getElementById("loginPassword").value;

        const saved =
            localStorage.getItem("rahul_user");


        if (!saved) {

            document.getElementById("authMessage").innerText =
                "Please register first.";

            return;
        }


        const user =
            JSON.parse(saved);


        if (
            (username === user.username ||
             username === user.email) &&
            password === user.password
        ) {

            localStorage.setItem(
                "rahul_logged_in",
                "true"
            );

            openApp(user.username);

        } else {

            document.getElementById("authMessage").innerText =
                "Invalid username or password.";
        }
    }


    function openApp(username) {

        document.getElementById("authScreen").style.display =
            "none";

        document.getElementById("appScreen").style.display =
            "block";

        document.getElementById("profileUsername").innerText =
            username;

    }


    function logoutUser() {

        localStorage.removeItem(
            "rahul_logged_in"
        );

        document.getElementById("appScreen").style.display =
            "none";

        document.getElementById("authScreen").style.display =
            "flex";

        showLogin();
    }


    /* =========================================================
       PAGE NAVIGATION
    ========================================================= */

    function openPage(pageId, button) {

        const pages =
            document.querySelectorAll(".page");

        pages.forEach(function(page) {
            page.classList.remove("active");
        });


        const selected =
            document.getElementById(pageId);

        if (selected) {
            selected.classList.add("active");
        }


        const navButtons =
            document.querySelectorAll(".navBtn");

        navButtons.forEach(function(btn) {
            btn.classList.remove("active");
        });


        if (button) {
            button.classList.add("active");
        }
    }


    /* =========================================================
       VIDEO SELECT
    ========================================================= */

    document
        .getElementById("videoInput")
        .addEventListener("change", function() {

            const file = this.files[0];

            if (!file) {
                return;
            }

            document.getElementById("selectedVideo").innerText =
                "Selected: " + file.name;
        });


    /* =========================================================
       LIVE
    ========================================================= */

    function startLive() {

        alert(
            "Live camera and real-time streaming will be connected in the next files."
        );
    }


    /* =========================================================
       AUTO LOGIN
    ========================================================= */

    window.addEventListener("load", function() {

        const loggedIn =
            localStorage.getItem("rahul_logged_in");

        const saved =
            localStorage.getItem("rahul_user");


        if (loggedIn === "true" && saved) {

            const user =
                JSON.parse(saved);

            openApp(user.username);
        }

    });

</script>

</body>
</html>
