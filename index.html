<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Chat App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    
    <!-- 1. REGISTER SCREEN -->
    <div id="register-screen" class="auth-box">
      <h2>Create Account</h2>
      <input type="text" id="reg-username" placeholder="Choose Username" />
      <input type="password" id="reg-password" placeholder="Choose Password" />
      <button onclick="handleRegister()">Register</button>
      <p>Already have an account? <a href="#" onclick="showScreen('login-screen')">Login here</a></p>
    </div>

    <!-- 2. LOGIN SCREEN -->
    <div id="login-screen" class="auth-box hidden">
      <h2>Welcome Back</h2>
      <input type="text" id="login-username" placeholder="Username" />
      <input type="password" id="login-password" placeholder="Password" />
      <button onclick="handleLogin()">Login</button>
      <p>Don't have an account? <a href="#" onclick="showScreen('register-screen')">Register here</a></p>
    </div>

    <!-- 3. LIVE CHAT ROOM SCREEN -->
    <div id="chat-screen" class="chat-box hidden">
      <div class="chat-header">
        <div>
          <h3 id="current-user-display">Chat Room</h3>
          <small class="online-status">🟢 Online</small>
        </div>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
      </div>

      <div id="messages-box" class="messages-box"></div>
      
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Type a message..." onkeydown="handleKeyPress(event)" />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
