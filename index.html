<!DOCTYPE html>
<html lang="hi">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <meta
        name="description"
        content="Rahul Live - Short Videos and Live Streaming"
    >

    <title>Rahul Live</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================================
     LOGIN / REGISTER
===================================================== -->

<section id="authScreen">

    <div class="authBox">

        <div class="logo">
            Rahul Live
        </div>

        <div class="tagline">
            Short Videos • LIVE Streaming
        </div>


        <div class="authTabs">

            <button
                id="loginTab"
                class="active"
                type="button"
            >
                Login
            </button>

            <button
                id="registerTab"
                type="button"
            >
                Register
            </button>

        </div>


        <!-- LOGIN -->

        <form id="loginForm">

            <div class="inputGroup">

                <input
                    id="loginUsername"
                    type="text"
                    placeholder="Username या Email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="inputGroup">

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                class="mainBtn"
                type="submit"
            >
                Login
            </button>

        </form>


        <!-- REGISTER -->

        <form
            id="registerForm"
            style="display:none;"
        >

            <div class="inputGroup">

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="inputGroup">

                <input
                    id="registerEmail"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="inputGroup">

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Password (कम से कम 6 characters)"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                class="mainBtn"
                type="submit"
            >
                Create Account
            </button>

        </form>


        <div
            id="authMessage"
            class="authMessage"
        ></div>

    </div>

</section>



<!-- =====================================================
     MAIN APP
===================================================== -->

<section id="appScreen">


    <!-- =================================================
         TOP BAR
    ================================================= -->

    <header class="topBar">

        <div class="topLogo">
            Rahul Live
        </div>


        <button
            id="topLiveBtn"
            class="liveTopBtn"
            type="button"
        >
            🔴 LIVE
        </button>

    </header>



    <!-- =================================================
         CONTENT
    ================================================= -->

    <main class="content">


        <!-- =============================================
             HOME / SHORT VIDEOS
        ============================================== -->

        <section
            id="homePage"
            class="page active"
        >

            <div
                id="videoFeed"
                class="videoFeed"
            >

                <div
                    style="
                        height:100%;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        color:#777;
                    "
                >
                    Videos loading...
                </div>

            </div>

        </section>



        <!-- =============================================
             LIVE PAGE
        ============================================== -->

        <section
            id="livePage"
            class="page"
        >

            <h2 class="sectionTitle">
                🔴 LIVE
            </h2>


            <div class="startLiveBox">

                <h3>
                    Go LIVE
                </h3>

                <p>
                    अपने followers के साथ LIVE आएं।
                </p>


                <button
                    id="startLiveBtn"
                    class="startLiveBtn"
                    type="button"
                >
                    🔴 Start LIVE
                </button>

            </div>


            <div
                id="liveGrid"
                class="liveGrid"
            ></div>

        </section>



        <!-- =============================================
             UPLOAD PAGE
        ============================================== -->

        <section
            id="uploadPage"
            class="page"
        >

            <div class="uploadBox">

                <h3>
                    🎬 Upload Short Video
                </h3>

                <p>
                    अपना Short Video select करें।
                </p>


                <label
                    for="videoFile"
                    class="uploadBtn"
                >
                    📁 Select Video
                </label>


                <input
                    id="videoFile"
                    type="file"
                    accept="video/*"
                >


                <div
                    id="selectedVideo"
                >
                    No video selected
                </div>


                <video
                    id="uploadPreview"
                    controls
                    playsinline
                    style="
                        display:none;
                        width:100%;
                        max-height:450px;
                        margin-top:15px;
                        border-radius:12px;
                    "
                ></video>


                <button
                    id="uploadVideoBtn"
                    class="mainBtn"
                    type="button"
                >
                    Upload Video
                </button>


                <div
                    id="uploadMessage"
                    class="authMessage"
                ></div>

            </div>

        </section>



        <!-- =============================================
             PROFILE PAGE
        ============================================== -->

        <section
            id="profilePage"
            class="page"
        >

            <div class="profileBox">


                <div
                    id="profileAvatar"
                    class="avatar"
                >
                    R
                </div>


                <div
                    id="profileName"
                    class="profileName"
                >
                    User
                </div>


                <div
                    id="profileUsername"
                    style="
                        margin-top:5px;
                        color:#777;
                        font-size:13px;
                    "
                >
                    @user
                </div>


                <div
                    id="profileBio"
                    style="
                        margin-top:12px;
                        color:#aaa;
                        font-size:13px;
                    "
                ></div>


                <div class="profileStats">


                    <div class="stat">

                        <strong id="profileVideos">
                            0
                        </strong>

                        <span>
                            Videos
                        </span>

                    </div>


                    <div class="stat">

                        <strong id="profileFollowers">
                            0
                        </strong>

                        <span>
                            Followers
                        </span>

                    </div>


                    <div class="stat">

                        <strong id="profileFollowing">
                            0
                        </strong>

                        <span>
                            Following
                        </span>

                    </div>


                </div>


                <button
                    id="logoutBtn"
                    class="logoutBtn"
                    type="button"
                >
                    Logout
                </button>

            </div>

        </section>


    </main>



    <!-- =================================================
         BOTTOM NAVIGATION
    ================================================= -->

    <nav class="bottomNav">


        <button
            class="navBtn active"
            data-page="homePage"
            type="button"
        >

            <span>
                🏠
            </span>

            Home

        </button>


        <button
            class="navBtn"
            data-page="livePage"
            type="button"
        >

            <span>
                🔴
            </span>

            LIVE

        </button>


        <button
            class="navBtn"
            data-page="uploadPage"
            type="button"
        >

            <span>
                ➕
            </span>

            Upload

        </button>


        <button
            class="navBtn"
            data-page="profilePage"
            type="button"
        >

            <span>
                👤
            </span>

            Profile

        </button>


    </nav>


</section>



<!-- =====================================================
     LIVE STUDIO
===================================================== -->

<section
    id="liveStudio"
    style="
        position:fixed;
        inset:0;
        z-index:4000;
        background:#000;
    "
>


    <video
        id="livePreview"
        autoplay
        muted
        playsinline
    ></video>


    <!-- LIVE TITLE -->

    <div
        style="
            position:absolute;
            top:20px;
            left:15px;
            right:15px;
            z-index:5;
        "
    >

        <input
            id="liveTitle"
            type="text"
            placeholder="LIVE title"
            value="Rahul Live"
            style="
                width:100%;
                min-height:45px;
                padding:0 13px;
                border:1px solid #333;
                border-radius:10px;
                outline:none;
                background:rgba(0,0,0,.65);
                color:#fff;
                font-size:14px;
            "
        >

    </div>


    <!-- LIVE CONTROLS -->

    <div
        style="
            position:absolute;
            left:15px;
            right:15px;
            bottom:25px;
            z-index:5;
            display:flex;
            gap:10px;
        "
    >

        <button
            id="goLiveConfirmBtn"
            type="button"
            style="
                flex:1;
                min-height:50px;
                border:0;
                border-radius:12px;
                background:#ff1744;
                color:#fff;
                font-weight:900;
                font-size:15px;
            "
        >
            🔴 Go LIVE
        </button>


        <button
            id="endLiveBtn"
            type="button"
            style="
                display:none;
                flex:1;
                min-height:50px;
                border:0;
                border-radius:12px;
                background:#20ff68;
                color:#000;
                font-weight:900;
                font-size:15px;
            "
        >
            End LIVE
        </button>


        <button
            id="closeLiveStudio"
            type="button"
            style="
                width:55px;
                min-height:50px;
                border:1px solid #444;
                border-radius:12px;
                background:rgba(0,0,0,.7);
                color:#fff;
                font-size:20px;
            "
        >
            ✕
        </button>

    </div>


</section>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="script.js"></script>

</body>
</html>
