<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <meta
        name="description"
        content="Rahul Live - Short Video and LIVE Streaming"
    >

    <title>Rahul Live</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================================
     AUTH SCREEN
===================================================== -->

<div id="authScreen">

    <div class="authBox">

        <div class="logo">
            Rahul Live
        </div>

        <div class="tagline">
            Short Videos • LIVE Streaming
        </div>


        <!-- AUTH TABS -->

        <div class="authTabs">

            <button
                id="loginTab"
                class="active"
                type="button"
            >
                Login
            </button>

            <button
                id="registerTab"
                type="button"
            >
                Register
            </button>

        </div>


        <!-- LOGIN -->

        <form id="loginForm">

            <div class="inputGroup">

                <input
                    id="loginUsername"
                    type="text"
                    placeholder="Username or Email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="inputGroup">

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                class="mainBtn"
                type="submit"
            >
                Login
            </button>

        </form>


        <!-- REGISTER -->

        <form
            id="registerForm"
            style="display:none;"
        >

            <div class="inputGroup">

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="inputGroup">

                <input
                    id="registerEmail"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="inputGroup">

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                class="mainBtn"
                type="submit"
            >
                Create Account
            </button>

        </form>


        <div
            id="authMessage"
            class="authMessage"
        ></div>

    </div>

</div>



<!-- =====================================================
     MAIN APPLICATION
===================================================== -->

<div id="appScreen">


    <!-- =================================================
         TOP BAR
    ================================================== -->

    <header class="topBar">

        <div class="topLogo">
            Rahul Live
        </div>


        <button
            id="topLiveBtn"
            class="liveTopBtn"
            type="button"
        >
            🔴 LIVE
        </button>

    </header>



    <!-- =================================================
         CONTENT
    ================================================== -->

    <main class="content">


        <!-- =============================================
             HOME / SHORT VIDEOS
        ============================================== -->

        <section
            id="homePage"
            class="page active"
        >

            <div
                id="videoFeed"
                class="videoFeed"
            >

                <!-- Videos will be loaded by script.js -->

                <div
                    id="videoLoading"
                    style="
                        min-height:100%;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        color:#777;
                        text-align:center;
                    "
                >
                    Loading videos...
                </div>

            </div>

        </section>



        <!-- =============================================
             LIVE PAGE
        ============================================== -->

        <section
            id="livePage"
            class="page"
        >

            <h2 class="sectionTitle">
                LIVE
            </h2>


            <div class="startLiveBox">

                <h3>
                    🔴 Go LIVE
                </h3>

                <p>
                    Start your own live stream.
                </p>


                <button
                    id="startLiveBtn"
                    class="startLiveBtn"
                    type="button"
                >
                    Start LIVE
                </button>

            </div>


            <div
                id="liveGrid"
                class="liveGrid"
            >

                <!-- Live streams will be loaded here -->

                <div
                    id="liveLoading"
                    style="
                        grid-column:1/-1;
                        padding:30px;
                        text-align:center;
                        color:#777;
                    "
                >
                    Loading LIVE streams...
                </div>

            </div>

        </section>



        <!-- =============================================
             UPLOAD PAGE
        ============================================== -->

        <section
            id="uploadPage"
            class="page"
        >

            <h2 class="sectionTitle">
                Upload Short Video
            </h2>


            <div class="uploadBox">

                <h3>
                    🎬 Create a Short
                </h3>

                <p>
                    Select a video from your phone.
                </p>


                <label
                    for="videoFile"
                    class="uploadBtn"
                >
                    Select Video
                </label>


                <input
                    id="videoFile"
                    type="file"
                    accept="video/*"
                >


                <div id="selectedVideo">
                    No video selected
                </div>


                <video
                    id="uploadPreview"
                    controls
                    playsinline
                    style="
                        display:none;
                        width:100%;
                        margin-top:15px;
                        max-height:400px;
                        border-radius:12px;
                        background:#000;
                    "
                ></video>


                <div
                    class="inputGroup"
                    style="margin-top:15px;"
                >

                    <textarea
                        id="videoCaption"
                        placeholder="Write a caption..."
                        maxlength="1000"
                        style="
                            width:100%;
                            min-height:90px;
                            padding:12px;
                            border:1px solid #303030;
                            border-radius:10px;
                            background:#111;
                            color:#fff;
                            resize:vertical;
                            outline:none;
                        "
                    ></textarea>

                </div>


                <button
                    id="uploadVideoBtn"
                    class="mainBtn"
                    type="button"
                >
                    Upload Video
                </button>


                <div
                    id="uploadMessage"
                    class="authMessage"
                ></div>

            </div>

        </section>



        <!-- =============================================
             PROFILE PAGE
        ============================================== -->

        <section
            id="profilePage"
            class="page"
        >

            <div class="profileBox">


                <div
                    id="profileAvatar"
                    class="avatar"
                >
                    R
                </div>


                <div
                    id="profileName"
                    class="profileName"
                >
                    Rahul
                </div>


                <div
                    id="profileUsername"
                    style="
                        margin-top:5px;
                        color:#888;
                        font-size:13px;
                    "
                >
                    @username
                </div>


                <div class="profileStats">


                    <div class="stat">

                        <strong id="profileVideos">
                            0
                        </strong>

                        <span>
                            Videos
                        </span>

                    </div>


                    <div class="stat">

                        <strong id="profileFollowers">
                            0
                        </strong>

                        <span>
                            Followers
                        </span>

                    </div>


                    <div class="stat">

                        <strong id="profileFollowing">
                            0
                        </strong>

                        <span>
                            Following
                        </span>

                    </div>


                </div>


                <div
                    id="profileBio"
                    style="
                        margin-top:20px;
                        color:#aaa;
                        line-height:1.5;
                    "
                >
                </div>


                <button
                    id="logoutBtn"
                    class="logoutBtn"
                    type="button"
                >
                    Logout
                </button>

            </div>

        </section>



        <!-- =============================================
             LIVE STUDIO
        ============================================== -->

        <section
            id="liveStudio"
            class="page"
            style="
                position:fixed;
                z-index:2000;
                inset:0;
                background:#000;
                padding:0;
            "
        >


            <div
                style="
                    position:absolute;
                    z-index:20;
                    top:0;
                    left:0;
                    right:0;
                    height:60px;
                    display:flex;
                    align-items:center;
                    justify-content:space-between;
                    padding:0 15px;
                    background:rgba(0,0,0,.65);
                "
            >

                <strong>
                    🔴 LIVE
                </strong>


                <button
                    id="closeLiveStudio"
                    type="button"
                    style="
                        width:38px;
                        height:38px;
                        border:0;
                        border-radius:50%;
                        background:rgba(255,255,255,.12);
                        color:#fff;
                        font-size:20px;
                    "
                >
                    ×
                </button>

            </div>


            <video
                id="livePreview"
                autoplay
                muted
                playsinline
                style="
                    width:100%;
                    height:100%;
                    object-fit:cover;
                    background:#111;
                "
            ></video>


            <div
                style="
                    position:absolute;
                    z-index:20;
                    left:15px;
                    right:15px;
                    bottom:25px;
                    display:flex;
                    flex-direction:column;
                    gap:10px;
                "
            >

                <input
                    id="liveTitle"
                    type="text"
                    placeholder="LIVE title"
                    maxlength="100"
                    style="
                        width:100%;
                        min-height:46px;
                        padding:12px;
                        border:1px solid rgba(255,255,255,.25);
                        border-radius:10px;
                        background:rgba(0,0,0,.65);
                        color:#fff;
                        outline:none;
                    "
                >


                <button
                    id="goLiveConfirmBtn"
                    type="button"
                    style="
                        width:100%;
                        min-height:50px;
                        border:0;
                        border-radius:12px;
                        background:#ff1744;
                        color:#fff;
                        font-weight:800;
                    "
                >
                    🔴 Start Broadcasting
                </button>


                <button
                    id="endLiveBtn"
                    type="button"
                    style="
                        display:none;
                        width:100%;
                        min-height:50px;
                        border:1px solid #ff1744;
                        border-radius:12px;
                        background:#000;
                        color:#ff1744;
                        font-weight:800;
                    "
                >
                    End LIVE
                </button>

            </div>

        </section>


    </main>



    <!-- =================================================
         BOTTOM NAVIGATION
    ================================================== -->

    <nav class="bottomNav">


        <button
            class="navBtn active"
            data-page="homePage"
            type="button"
        >

            <span>
                🏠
            </span>

            Home

        </button>


        <button
            class="navBtn"
            data-page="livePage"
            type="button"
        >

            <span>
                🔴
            </span>

            LIVE

        </button>


        <button
            class="navBtn"
            data-page="uploadPage"
            type="button"
        >

            <span>
                ＋
            </span>

            Create

        </button>


        <button
            class="navBtn"
            data-page="profilePage"
            type="button"
        >

            <span>
                👤
            </span>

            Profile

        </button>


    </nav>


</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="script.js"></script>

</body>
</html>
